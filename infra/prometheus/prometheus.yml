global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# The job name becomes the `job` label, which TraceOps treats as the service name.
scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8003"]
  - job_name: orders
    static_configs:
      - targets: ["orders:8002"]
  - job_name: inventory
    static_configs:
      - targets: ["inventory:8001"]
